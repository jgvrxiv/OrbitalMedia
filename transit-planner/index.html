<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planeador de líneas de transporte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#f4f6fc;--card:#fff;--line:#dfe4f2;--tx:#14192e;--mut:#5b6685;--acc:#4363d8}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1426;--card:#171e38;--line:#2a3354;--tx:#e8ecf8;--mut:#93a0c4}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
  aside{width:340px;max-width:100%;overflow-y:auto;padding:14px;border-right:1px solid var(--line);background:var(--bg)}
  #map{flex:1;min-width:0}
  h1{font-size:1.15rem;margin:0 0 2px}.sub{color:var(--mut);font-size:.85rem;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  button,select,input{font:inherit;color:inherit}
  button{padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);cursor:pointer}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.danger{color:#d33}
  input[type=text],input[type=number],select{padding:5px 7px;border-radius:7px;border:1px solid var(--line);background:var(--card);min-width:0}
  input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:none}
  .line{border-left:6px solid var(--c);cursor:pointer}
  .line.active{outline:2px solid var(--acc)}
  .line .name{flex:1}
  .stats{font-size:.85rem;color:var(--mut);margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  .stats b{color:var(--tx)}
  .hint{font-size:.82rem;color:var(--mut)}
  .stop{display:flex;gap:6px;font-size:.85rem;align-items:center}
  .stop span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stop button{padding:1px 7px}
  @media (max-width:720px){body{flex-direction:column-reverse}aside{width:100%;height:46%;border-right:0;border-top:1px solid var(--line)}#map{height:54%;flex:none}}
</style>
</head>
<body>
<aside>
  <h1>Planeador de líneas</h1>
  <p class="sub">Haz clic en el mapa para añadir paradas a la línea activa. Arrastra una parada para moverla.</p>
  <div class="row" style="margin-bottom:10px">
    <button id="addLine" class="primary">+ Nueva línea</button>
    <label class="hint">Frecuencia (min) <input id="headway" type="number" min="1" max="120" value="10" style="width:60px"></label>
  </div>
  <div id="lines"></div>
  <div class="card">
    <div class="row">
      <button id="share">Copiar enlace</button>
      <button id="export">Exportar</button>
      <button id="import">Importar</button>
      <button id="clear" class="danger">Borrar todo</button>
    </div>
    <input id="file" type="file" accept="application/json" hidden>
    <p class="hint" id="msg" role="status" style="margin:8px 0 0"></p>
  </div>
  <p class="hint">Las distancias son en línea recta entre paradas (un mínimo). Velocidades y costos son supuestos genéricos para comparar opciones, no cifras de ingeniería. Costos en millones de USD.</p>
</aside>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
'use strict';
// Lógica pura (sin DOM) para poder probarla con node:test.

const MODES = {
  bus:   { label: 'Bus',   speedKmh: 18, dwellSec: 25, costPerKm: 1.5,  costPerStop: 0.05 },
  tram:  { label: 'Tranvía', speedKmh: 22, dwellSec: 25, costPerKm: 25,  costPerStop: 1 },
  metro: { label: 'Metro', speedKmh: 35, dwellSec: 30, costPerKm: 120, costPerStop: 25 },
};

const PALETTE = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#008080', '#9a6324', '#f032e6'];

const R = 6371.0088;
const rad = (d) => (d * Math.PI) / 180;

function haversineKm(a, b) {
  const dLat = rad(b.lat - a.lat);
  const dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

function lengthKm(stops) {
  let t = 0;
  for (let i = 1; i < stops.length; i++) t += haversineKm(stops[i - 1], stops[i]);
  return t;
}

/**
 * Estimaciones simples y editables. La longitud es en línea recta entre paradas
 * (la fase 2 la ajustará a las calles), así que es un mínimo, no un valor real.
 */
function lineStats(line, { headwayMin = 10, detour = 1 } = {}) {
  const m = MODES[line.mode] || MODES.bus;
  const km = lengthKm(line.stops) * detour;
  const n = line.stops.length;
  if (n < 2) return { km, stops: n, oneWayMin: 0, roundTripMin: 0, vehicles: 0, cost: 0, valid: false };
  const oneWayMin = (km / m.speedKmh) * 60 + (n * m.dwellSec) / 60;
  const roundTripMin = oneWayMin * 2;
  return {
    km,
    stops: n,
    oneWayMin,
    roundTripMin,
    vehicles: Math.ceil(roundTripMin / Math.max(1, headwayMin)),
    cost: km * m.costPerKm + n * m.costPerStop,
    valid: true,
  };
}

function newLine(index) {
  return { id: 'l' + Date.now().toString(36) + index, name: `Línea ${index + 1}`, color: PALETTE[index % PALETTE.length], mode: 'bus', stops: [] };
}

// ---- Serialización (guardado, exportar, compartir por enlace) ----

function validateState(s) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.lines)) throw new Error('Archivo no válido');
  const lines = s.lines.slice(0, 50).map((l, i) => ({
    id: String(l.id || 'l' + i).slice(0, 40),
    name: String(l.name || `Línea ${i + 1}`).slice(0, 60),
    color: /^#[0-9a-f]{6}$/i.test(l.color) ? l.color : PALETTE[i % PALETTE.length],
    mode: MODES[l.mode] ? l.mode : 'bus',
    stops: (Array.isArray(l.stops) ? l.stops : []).slice(0, 500)
      .filter((p) => Number.isFinite(p?.lat) && Number.isFinite(p?.lng) && Math.abs(p.lat) <= 90 && Math.abs(p.lng) <= 180)
      .map((p, j) => ({ lat: +p.lat.toFixed(6), lng: +p.lng.toFixed(6), name: String(p.name || `Parada ${j + 1}`).slice(0, 60) })),
  }));
  const headwayMin = Number.isFinite(s.headwayMin) ? Math.min(120, Math.max(1, s.headwayMin)) : 10;
  return { lines, headwayMin };
}

const b64 = {
  enc: (str) => btoa(String.fromCharCode(...new TextEncoder().encode(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0))),
};

const encodeState = (state) => b64.enc(JSON.stringify(state));
const decodeState = (str) => validateState(JSON.parse(b64.dec(str)));


const KEY = 'transit-planner-v1';
const $ = (s) => document.querySelector(s);
let state = { lines: [], headwayMin: 10 };
let activeId = null;
const layers = new Map(); // lineId -> { poly, markers }

const map = L.map('map').setView([4.711, -74.072], 12);
// OSM bloquea peticiones sin Referer (abrir el archivo con doble clic, file://).
// En ese caso usamos CARTO, que también dibuja datos de OpenStreetMap.
const OSM = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
const tiles = location.protocol === 'file:'
  ? { url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', subdomains: 'abcd', attribution: OSM + ' &copy; <a href="https://carto.com/attributions">CARTO</a>' }
  : { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', subdomains: 'abc', attribution: OSM };
L.tileLayer(tiles.url, { maxZoom: 19, subdomains: tiles.subdomains, attribution: tiles.attribution, referrerPolicy: 'origin' }).addTo(map);

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k === 'class' ? (n.className = v) : n.setAttribute(k, v);
  n.append(...kids);
  return n;
}
const say = (t) => { $('#msg').textContent = t; };
const active = () => state.lines.find((l) => l.id === activeId);

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* modo privado o sin espacio */ }
}

function drawMap() {
  for (const { poly, markers } of layers.values()) { poly.remove(); markers.forEach((m) => m.remove()); }
  layers.clear();
  for (const line of state.lines) {
    const isActive = line.id === activeId;
    const poly = L.polyline(line.stops.map((s) => [s.lat, s.lng]), { color: line.color, weight: isActive ? 7 : 4, opacity: 0.9 }).addTo(map);
    const markers = line.stops.map((s, i) => (isActive ? draggableStop(line, i, () => markers, poly) : staticStop(line, s)));
    layers.set(line.id, { poly, markers });
  }
}

function staticStop(line, s) {
  return L.circleMarker([s.lat, s.lng], { radius: 6, color: line.color, fillColor: '#fff', fillOpacity: 1, weight: 3 }).addTo(map).bindTooltip(s.name);
}

// Solo la línea activa se edita: sus paradas se pueden arrastrar y renombrar (doble clic).
function draggableStop(line, i, getMarkers, poly) {
  const icon = L.divIcon({
    className: '',
    html: `<div style="width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid ${line.color};box-shadow:0 0 0 1px #0004"></div>`,
    iconSize: [18, 18], iconAnchor: [9, 9],
  });
  const m = L.marker([line.stops[i].lat, line.stops[i].lng], { draggable: true, icon, title: line.stops[i].name }).addTo(map);
  m.on('drag', () => poly.setLatLngs(getMarkers().map((x) => x.getLatLng())));
  m.on('dragend', () => {
    const p = m.getLatLng();
    line.stops[i].lat = +p.lat.toFixed(6);
    line.stops[i].lng = +p.lng.toFixed(6);
    commit();
  });
  m.on('dblclick', (e) => {
    L.DomEvent.stop(e);
    const n = prompt('Nombre de la parada', line.stops[i].name);
    if (n?.trim()) { line.stops[i].name = n.trim().slice(0, 60); commit(); }
  });
  return m;
}

const fmt = (n, d = 1) => n.toLocaleString('es-CO', { maximumFractionDigits: d });

function renderList() {
  const box = $('#lines');
  box.replaceChildren();
  if (!state.lines.length) box.append(el('p', { class: 'hint' }, 'Crea una línea para empezar.'));
  for (const line of state.lines) {
    const st = lineStats(line, { headwayMin: state.headwayMin });
    const name = el('input', { type: 'text', class: 'name', value: line.name });
    name.onclick = (e) => e.stopPropagation();
    name.onchange = () => { line.name = name.value.trim().slice(0, 60) || line.name; commit(); };
    const color = el('input', { type: 'color', value: line.color });
    color.onclick = (e) => e.stopPropagation();
    color.oninput = () => { line.color = color.value; commit(); };
    const mode = el('select', {}, ...Object.entries(MODES).map(([k, m]) => { const o = el('option', { value: k }, m.label); o.selected = k === line.mode; return o; }));
    mode.onclick = (e) => e.stopPropagation();
    mode.onchange = () => { line.mode = mode.value; commit(); };
    const del = el('button', { class: 'danger', title: 'Eliminar línea' }, '✕');
    del.onclick = (e) => {
      e.stopPropagation();
      if (!confirm(`¿Eliminar "${line.name}"?`)) return;
      state.lines = state.lines.filter((l) => l.id !== line.id);
      if (activeId === line.id) activeId = state.lines[0]?.id ?? null;
      commit();
    };
    const card = el('div', { class: 'card line' + (line.id === activeId ? ' active' : '') }, el('div', { class: 'row' }, color, name, mode, del));
    card.style.setProperty('--c', line.color);
    card.onclick = () => { activeId = line.id; commit(); };

    const stats = el('div', { class: 'stats' });
    const add = (k, v) => stats.append(el('span', {}, k + ' '), el('b', {}, v));
    add('Paradas', String(st.stops));
    add('Longitud', st.valid ? fmt(st.km) + ' km' : '—');
    add('Viaje (ida)', st.valid ? fmt(st.oneWayMin, 0) + ' min' : '—');
    add('Vehículos', st.valid ? String(st.vehicles) : '—');
    add('Costo aprox.', st.valid ? fmt(st.cost) + ' M USD' : '—');
    card.append(stats);

    if (line.id === activeId && line.stops.length) {
      const list = el('div', { style: 'margin-top:8px' });
      line.stops.forEach((s, i) => {
        const rm = el('button', { title: 'Quitar parada' }, '✕');
        rm.onclick = (e) => { e.stopPropagation(); line.stops.splice(i, 1); commit(); };
        list.append(el('div', { class: 'stop' }, el('span', {}, `${i + 1}. ${s.name}`), rm));
      });
      card.append(list);
    }
    box.append(card);
  }
}

function commit() {
  save();
  drawMap();
  renderList();
}

map.on('click', (e) => {
  const line = active();
  if (!line) { say('Primero crea una línea.'); return; }
  line.stops.push({ lat: +e.latlng.lat.toFixed(6), lng: +e.latlng.lng.toFixed(6), name: `Parada ${line.stops.length + 1}` });
  commit();
});
map.doubleClickZoom.disable();

$('#addLine').onclick = () => {
  const l = newLine(state.lines.length);
  state.lines.push(l);
  activeId = l.id;
  commit();
};
$('#headway').onchange = (e) => {
  state.headwayMin = Math.min(120, Math.max(1, Number(e.target.value) || 10));
  e.target.value = state.headwayMin;
  commit();
};
$('#clear').onclick = () => {
  if (!state.lines.length || !confirm('¿Borrar todas las líneas?')) return;
  state.lines = []; activeId = null; commit(); say('Plan borrado.');
};
$('#export').onclick = () => {
  const a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' })), download: 'plan-transporte.json' });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#import').onclick = () => $('#file').click();
$('#file').onchange = async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f || f.size > 2_000_000) return say('Archivo no válido o demasiado grande.');
  try {
    state = validateState(JSON.parse(await f.text()));
    activeId = state.lines[0]?.id ?? null;
    $('#headway').value = state.headwayMin;
    commit(); fitAll(); say('Plan importado.');
  } catch { say('No se pudo leer ese archivo.'); }
};
$('#share').onclick = async () => {
  const url = location.origin + location.pathname + '#p=' + encodeState(state);
  history.replaceState(null, '', url);
  try { await navigator.clipboard.writeText(url); say('Enlace copiado. Quien lo abra verá tu plan.'); }
  catch { say('Copia el enlace desde la barra del navegador.'); }
};

function fitAll() {
  const pts = state.lines.flatMap((l) => l.stops.map((s) => [s.lat, s.lng]));
  if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40] });
  else if (pts.length === 1) map.setView(pts[0], 14);
}

// Carga: primero el enlace compartido, si no, lo guardado en este navegador.
try {
  const m = location.hash.match(/^#p=(.+)$/);
  if (m) state = decodeState(m[1]);
  else { const raw = localStorage.getItem(KEY); if (raw) state = validateState(JSON.parse(raw)); }
} catch { say('No se pudo cargar el plan guardado; se empieza de cero.'); }
activeId = state.lines[0]?.id ?? null;
$('#headway').value = state.headwayMin;
commit();
fitAll();

})();
</script>
</body>
</html>
